<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defect Ticket Generator — Zyantik</title>
<style>
  :root {
    --brand:        #0d9488;
    --brand-dark:   #0f766e;
    --brand-light:  #f0fdfa;
    --zinc-50:      #fafafa;
    --zinc-100:     #f4f4f5;
    --zinc-200:     #e4e4e7;
    --zinc-300:     #d4d4d8;
    --zinc-400:     #a1a1aa;
    --zinc-500:     #71717a;
    --zinc-600:     #52525b;
    --zinc-900:     #18181b;
    --radius-sm:    4px;
    --radius-md:    6px;
    --radius-lg:    8px;
    --radius-xl:    12px;
    --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg:    0 8px 24px rgba(0,0,0,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--zinc-50);
    color: var(--zinc-900);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Header */
  .app-header {
    background: white;
    border-bottom: 1px solid var(--zinc-200);
    padding: 0 32px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .logo {
    width: 30px; height: 30px;
    background: var(--brand);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 16px; height: 16px; fill: white; }

  .app-title { font-size: 14px; font-weight: 600; color: var(--zinc-900); }
  .app-divider { width: 1px; height: 18px; background: var(--zinc-200); }
  .app-subtitle { font-size: 12px; color: var(--zinc-500); }

  /* Layout */
  .page { display: grid; grid-template-columns: 1fr 420px; gap: 24px; padding: 24px 32px; max-width: 1280px; margin: 0 auto; }

  /* Cards */
  .card {
    background: white;
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .card-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--zinc-100);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-header-icon {
    width: 20px; height: 20px;
    background: var(--brand-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .card-header-icon svg { width: 12px; height: 12px; fill: var(--brand); }

  .card-title { font-size: 12px; font-weight: 600; color: var(--zinc-900); }

  .card-body { padding: 16px 20px; }

  /* Form elements */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--zinc-500);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  input[type="text"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    color: var(--zinc-900);
    background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none;
  }

  input[type="text"]:focus,
  input[type="number"]:focus,
  textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
  }

  textarea { resize: vertical; line-height: 1.6; }

  .two-col { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }

  /* Ticket slug display */
  .ticket-slug {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 12px;
    background: var(--zinc-50);
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    color: var(--brand);
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  /* Screenshot rows */
  .screenshots-wrap { display: flex; flex-direction: column; gap: 10px; }

  .screenshot-entry {
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .screenshot-entry:focus-within { border-color: var(--brand); }

  .screenshot-entry-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--zinc-50);
    border-bottom: 1px solid var(--zinc-100);
  }

  .screenshot-num {
    width: 20px; height: 20px;
    background: var(--brand);
    color: white;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .screenshot-filename {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    color: var(--zinc-500);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .remove-btn {
    width: 24px; height: 24px;
    border: none;
    background: none;
    color: var(--zinc-400);
    cursor: pointer;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .remove-btn:hover { background: #fee2e2; color: #dc2626; }

  .screenshot-entry-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--zinc-200);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    background: white;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--brand);
    background: var(--brand-light);
  }

  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-zone-icon { color: var(--zinc-400); }
  .drop-zone-icon svg { width: 24px; height: 24px; }

  .drop-zone-text {
    font-size: 12px;
    color: var(--zinc-500);
    pointer-events: none;
  }

  .drop-zone-sub {
    font-size: 11px;
    color: var(--zinc-400);
    pointer-events: none;
  }

  .drop-zone-preview {
    width: 100%;
    border-radius: var(--radius-sm);
    max-height: 140px;
    object-fit: contain;
    display: none;
  }

  /* Add screenshot button */
  .add-screenshot-btn {
    width: 100%;
    padding: 9px;
    border: 1px dashed var(--zinc-300);
    border-radius: var(--radius-md);
    background: white;
    color: var(--zinc-500);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }

  .add-screenshot-btn:hover {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--brand-light);
  }

  /* Paste hint */
  .paste-hint {
    background: var(--brand-light);
    border: 1px solid #99f6e4;
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: 11px;
    color: var(--brand-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .paste-hint kbd {
    background: white;
    border: 1px solid #99f6e4;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: inherit;
    font-weight: 600;
  }

  /* Right panel — preview */
  .preview-panel { position: sticky; top: 76px; height: fit-content; }

  .preview-box {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--zinc-600);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 440px;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .preview-box .md-h1 { color: var(--zinc-900); font-weight: 700; font-size: 12px; }
  .preview-box .md-h2 { color: var(--brand); font-weight: 600; }
  .preview-box .md-key { color: var(--zinc-900); }

  /* Filename chips */
  .filename-chips { display: flex; flex-direction: column; gap: 6px; padding: 12px 20px; border-top: 1px solid var(--zinc-100); }

  .filename-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--zinc-50);
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    color: var(--zinc-600);
  }

  .chip-dot {
    width: 8px; height: 8px;
    background: var(--brand);
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Action buttons */
  .actions {
    padding: 14px 20px;
    border-top: 1px solid var(--zinc-100);
    display: flex;
    gap: 8px;
  }

  .btn {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--zinc-200);
    background: white;
    color: var(--zinc-600);
  }

  .btn:hover { background: var(--zinc-50); border-color: var(--zinc-300); }
  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--brand);
    color: white;
    border-color: var(--brand);
    justify-content: center;
  }

  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }

  .btn svg { width: 14px; height: 14px; }

  /* Status toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--zinc-900);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius-lg);
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Section label */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--zinc-400);
    margin-bottom: 10px;
  }

  /* Settings bar */
  .settings-bar {
    background: white;
    border-bottom: 1px solid var(--zinc-200);
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
  }
  .settings-bar.open { max-height: 200px; }
  .settings-bar-inner {
    display: grid;
    grid-template-columns: 1fr 200px;
    gap: 16px;
    align-items: end;
    padding: 16px 32px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .settings-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .settings-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--zinc-300);
    flex-shrink: 0;
  }
  .settings-dot.ok { background: #22c55e; }
  .settings-dot.err { background: #ef4444; }
  .settings-status-text { font-size: 11px; color: var(--zinc-500); }

  /* Header settings btn */
  .hdr-settings-btn {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: 30px;
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    background: white;
    color: var(--zinc-600);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .hdr-settings-btn:hover { background: var(--zinc-50); border-color: var(--zinc-300); }
  .hdr-settings-btn.active { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
  .hdr-settings-btn svg { width: 14px; height: 14px; }

  /* AI result panel */
  .ai-result {
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: none;
    margin-top: 0;
  }
  .ai-result.visible { display: block; }
  .ai-result-header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .ai-result-header.pass { background: #f0fdf4; border-bottom: 1px solid #bbf7d0; color: #166534; }
  .ai-result-header.warn { background: #fffbeb; border-bottom: 1px solid #fde68a; color: #92400e; }
  .ai-result-header.err  { background: #fef2f2; border-bottom: 1px solid #fecaca; color: #991b1b; }
  .ai-result-header svg { width: 15px; height: 15px; flex-shrink: 0; }
  .ai-result-body { padding: 14px 16px; background: white; }
  .ai-score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--zinc-100);
  }
  .ai-score-label { font-size: 11px; color: var(--zinc-500); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .ai-score-value { font-size: 22px; font-weight: 700; }
  .ai-score-value.high { color: #16a34a; }
  .ai-score-value.mid  { color: #d97706; }
  .ai-score-value.low  { color: #dc2626; }
  .ai-issues { display: flex; flex-direction: column; gap: 6px; }
  .ai-issue {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    font-size: 12px;
    line-height: 1.5;
  }
  .ai-issue.issue      { background: #fffbeb; color: #78350f; }
  .ai-issue.suggestion { background: var(--zinc-50); color: var(--zinc-700); }
  .ai-issue.ok         { background: #f0fdf4; color: #166534; }
  .ai-issue-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .ai-summary-text { font-size: 12px; color: var(--zinc-600); line-height: 1.6; margin-top: 10px; }

  /* AI check button */
  .btn-ai {
    background: #1d4ed8;
    color: white;
    border-color: #1d4ed8;
    justify-content: center;
  }
  .btn-ai:hover { background: #1e40af; border-color: #1e40af; }
  .btn-ai:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Warning badge on download button */
  .btn-wrap { position: relative; display: inline-flex; }
  .warn-badge {
    position: absolute;
    top: -7px; right: -7px;
    width: 17px; height: 17px;
    background: #f59e0b;
    color: white;
    border-radius: 50%;
    font-size: 9px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
  }
  .warn-badge.visible { display: flex; }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
  </div>
  <span class="app-title">Zyantik</span>
  <div class="app-divider"></div>
  <span class="app-subtitle">Defect Ticket Generator</span>
  <button class="hdr-settings-btn" id="settingsToggle" onclick="toggleSettings()">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 01-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 01-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 01.52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 011.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 011.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 01.52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 01-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 01-1.255-.52l-.094-.319zm-2.633.283a.873.873 0 011.674 0l.094.319a1.873 1.873 0 002.693 1.115l.291-.16a.873.873 0 011.198 1.198l-.16.292a1.873 1.873 0 001.116 2.692l.318.094a.873.873 0 010 1.674l-.319.094a1.873 1.873 0 00-1.115 2.693l.16.291a.873.873 0 01-1.198 1.198l-.292-.16a1.873 1.873 0 00-2.692 1.116l-.094.318a.873.873 0 01-1.674 0l-.094-.319a1.873 1.873 0 00-2.693-1.115l-.291.16a.873.873 0 01-1.198-1.198l.16-.292a1.873 1.873 0 00-1.116-2.692l-.318-.094a.873.873 0 010-1.674l.319-.094A1.873 1.873 0 003.06 4.377l-.16-.292a.873.873 0 011.198-1.198l.292.16a1.873 1.873 0 002.692-1.116l.094-.318zM8 5.754a2.246 2.246 0 100 4.492 2.246 2.246 0 000-4.492z"/></svg>
    AI Settings
  </button>
</header>

<!-- Settings bar (collapsible) -->
<div class="settings-bar" id="settingsBar">
  <div class="settings-bar-inner">
    <div>
      <div class="field" style="margin-bottom:8px">
        <label>Anthropic API key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." oninput="saveSettings()" style="font-family:monospace;letter-spacing:0.05em">
      </div>
      <div class="settings-status">
        <div class="settings-dot" id="settingsDot"></div>
        <span class="settings-status-text" id="settingsStatusText">Enter your API key to enable AI quality check</span>
      </div>
    </div>
    <div>
      <label>Model</label>
      <select id="modelSelect" onchange="saveSettings()">
        <option value="claude-sonnet-4-5">Claude Sonnet 4.5 (recommended)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (faster)</option>
        <option value="claude-opus-4-5">Claude Opus 4.5 (most thorough)</option>
      </select>
    </div>
  </div>
</div>

<div class="page">

  <!-- Left: form -->
  <div class="form-col">

    <!-- Identity card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm1 4H7V5h2v2zm0 5H7V8h2v3z"/></svg>
        </div>
        <span class="card-title">Ticket identity</span>
      </div>
      <div class="card-body">
        <div class="two-col field">
          <div>
            <label>Number</label>
            <input type="number" id="defNum" min="1" max="999" value="1" oninput="update()">
          </div>
          <div>
            <label>Short title (use hyphens)</label>
            <input type="text" id="defTitle" placeholder="e.g. header-overlap" oninput="update()">
          </div>
        </div>
        <div class="field">
          <label>Generated filename</label>
          <div class="ticket-slug" id="ticketSlug">DEF-001-defect.md</div>
        </div>
      </div>
    </div>

    <!-- Details card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M2 3h12v2H2V3zm0 4h12v2H2V7zm0 4h7v2H2v-2z"/></svg>
        </div>
        <span class="card-title">Defect details</span>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Page / tab affected</label>
          <input type="text" id="pageAffected" placeholder="e.g. Summary tab, Add modal on Vendor Costs" oninput="update()">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="What is wrong, where you see it, and what you expected instead" oninput="update()"></textarea>
        </div>
        <div class="field">
          <label>Steps to reproduce</label>
          <textarea id="steps" rows="3" placeholder="1. Open the app&#10;2. Navigate to...&#10;3. You see X instead of Y" oninput="update()"></textarea>
        </div>
        <div class="field">
          <label>Console errors</label>
          <textarea id="consoleErrors" rows="2" placeholder="Paste browser console errors here, or leave blank" oninput="update()"></textarea>
        </div>
      </div>
    </div>

    <!-- Screenshots card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M1 3a1 1 0 011-1h12a1 1 0 011 1v9a1 1 0 01-1 1H2a1 1 0 01-1-1V3zm1 1v7h12V4H2zm5 1l3 3H9v2H7V8H5l3-3z"/></svg>
        </div>
        <span class="card-title">Screenshots</span>
      </div>
      <div class="card-body">
        <div class="paste-hint">
          <kbd>Ctrl</kbd> + <kbd>V</kbd> anywhere on the page to paste a screenshot directly into the active slot
        </div>
        <div class="screenshots-wrap" id="screenshotList" style="margin-top:12px"></div>
        <button class="add-screenshot-btn" onclick="addScreenshot()" style="margin-top:10px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a1 1 0 011 1v4h4a1 1 0 010 2H9v4a1 1 0 01-2 0V9H3a1 1 0 010-2h4V3a1 1 0 011-1z"/></svg>
          Add screenshot
        </button>
      </div>
    </div>

  </div>

  <!-- Right: preview -->
  <div class="preview-panel">
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm1 2v8h8V4H4z"/></svg>
        </div>
        <span class="card-title">Ticket preview</span>
      </div>
      <div class="preview-box" id="preview"></div>
      <div class="filename-chips" id="filenameChips"></div>

      <!-- AI check result panel -->
      <div class="ai-result" id="aiResult">
        <div class="ai-result-header" id="aiResultHeader">
          <svg id="aiResultIcon" viewBox="0 0 16 16" fill="currentColor"></svg>
          <span id="aiResultTitle"></span>
        </div>
        <div class="ai-result-body">
          <div class="ai-score-row">
            <span class="ai-score-label">Quality score</span>
            <span class="ai-score-value" id="aiScore"></span>
          </div>
          <div class="ai-issues" id="aiIssues"></div>
          <div class="ai-summary-text" id="aiSummary"></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ai" id="aiCheckBtn" onclick="runAiCheck()">
          <svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm-.75 2.5v3.25l2.5 1.5.5-.87-2-1.2V5.5h-1z"/></svg>
          Run AI check
        </button>
        <div class="btn-wrap" style="flex:1">
          <button class="btn btn-primary" id="downloadBtn" onclick="downloadAll()" style="width:100%">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a1 1 0 011 1v6.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 011.414-1.414L7 8.586V2a1 1 0 011-1zM3 13a1 1 0 000 2h10a1 1 0 000-2H3z"/></svg>
            Download
          </button>
          <div class="warn-badge" id="warnBadge"></div>
        </div>
        <button class="btn" onclick="copyTicket()" title="Copy markdown" style="flex-shrink:0">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2a2 2 0 00-2 2v8a2 2 0 002 2h5a2 2 0 002-2V8l-4-4H4zm5 0l4 4h-3a1 1 0 01-1-1V2zM6 6a1 1 0 000 2h4a1 1 0 000-2H6zm0 3a1 1 0 000 2h3a1 1 0 000-2H6z"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  let screenshots = [{ label: '', imageDataUrl: null, imageExt: 'png' }];
  let activeSlot = 0;

  // ── Settings ─────────────────────────────────────────────────────────────

  function toggleSettings() {
    const bar = document.getElementById('settingsBar');
    const btn = document.getElementById('settingsToggle');
    const open = bar.classList.toggle('open');
    btn.classList.toggle('active', open);
  }

  function saveSettings() {
    const key = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelSelect').value;
    localStorage.setItem('zyantik_api_key', key);
    localStorage.setItem('zyantik_model', model);
    updateSettingsStatus(key);
  }

  function loadSettings() {
    const key = localStorage.getItem('zyantik_api_key') || '';
    const model = localStorage.getItem('zyantik_model') || 'claude-sonnet-4-5';
    document.getElementById('apiKey').value = key;
    document.getElementById('modelSelect').value = model;
    updateSettingsStatus(key);
  }

  function updateSettingsStatus(key) {
    const dot = document.getElementById('settingsDot');
    const text = document.getElementById('settingsStatusText');
    const btn = document.getElementById('aiCheckBtn');
    if (!btn) return;
    if (key && key.startsWith('sk-ant-')) {
      dot.className = 'settings-dot ok';
      text.textContent = 'API key configured — AI check enabled';
      btn.disabled = false;
    } else if (key) {
      dot.className = 'settings-dot err';
      text.textContent = 'Key format looks incorrect — should start with sk-ant-';
      btn.disabled = true;
    } else {
      dot.className = 'settings-dot';
      text.textContent = 'Enter your API key to enable AI quality check';
      btn.disabled = true;
    }
  }

  function pad(n) { return String(n).padStart(3, '0'); }

  function slug(str) {
    return str.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'defect';
  }

  function getPrefix() {
    const num = pad(parseInt(document.getElementById('defNum').value) || 1);
    const title = slug(document.getElementById('defTitle').value || 'defect');
    return 'DEF-' + num + '-' + title;
  }

  function getScreenshotFilename(i) {
    const prefix = getPrefix();
    const s = screenshots[i];
    const lbl = s.label ? slug(s.label) : 'screenshot-' + (i + 1);
    return prefix + '-' + lbl + '.' + (s.imageExt || 'png');
  }

  function renderScreenshots() {
    const list = document.getElementById('screenshotList');
    const existingEntries = list.querySelectorAll('.screenshot-entry');

    screenshots.forEach((s, i) => {
      const fname = getScreenshotFilename(i);

      // If a DOM entry already exists for this index, update it in place
      // without rebuilding — this preserves focus and cursor position
      if (existingEntries[i]) {
        const entry = existingEntries[i];
        entry.querySelector('.screenshot-filename').textContent = fname;
        updateDropZone(entry.querySelector('.drop-zone'), s, i);
        return;
      }

      // No existing entry — build a new one
      const entry = document.createElement('div');
      entry.className = 'screenshot-entry';
      entry.innerHTML = `
        <div class="screenshot-entry-header">
          <div class="screenshot-num">${i + 1}</div>
          <span class="screenshot-filename">${fname}</span>
          <button class="remove-btn" onclick="removeScreenshot(${i})" title="Remove">×</button>
        </div>
        <div class="screenshot-entry-body">
          <div>
            <label>Label / description</label>
            <input type="text" placeholder="e.g. header overlap visible" value="${s.label}"
              oninput="labelChanged(${i}, this.value)" onfocus="activeSlot=${i}">
          </div>
          <div class="drop-zone" id="dz-${i}"
            ondragover="dzOver(event,${i})" ondragleave="dzLeave(${i})"
            ondrop="dzDrop(event,${i})" onclick="document.getElementById('fi-${i}').click()"
            onfocus="activeSlot=${i}" tabindex="0">
            <input type="file" id="fi-${i}" accept="image/*"
              onchange="fileChosen(event,${i})" onclick="event.stopPropagation()" style="display:none">
          </div>
        </div>
      `;
      updateDropZone(entry.querySelector('.drop-zone'), s, i);
      list.appendChild(entry);
    });

    // Remove any extra DOM entries beyond current screenshots length
    for (let j = screenshots.length; j < existingEntries.length; j++) {
      existingEntries[j].remove();
    }
  }

  function updateDropZone(dz, s, i) {
    const fileInput = dz.querySelector('input[type="file"]');
    const existingImg = dz.querySelector('img');
    const existingPlaceholder = dz.querySelector('.drop-zone-icon');

    if (s.imageDataUrl) {
      if (existingPlaceholder) existingPlaceholder.remove();
      dz.querySelectorAll('.drop-zone-text, .drop-zone-sub').forEach(el => el.remove());
      if (!existingImg) {
        const img = document.createElement('img');
        img.style.cssText = 'display:block;max-height:140px;width:100%;object-fit:contain;border-radius:4px';
        if (fileInput) dz.insertBefore(img, fileInput);
        else dz.appendChild(img);
      }
      dz.querySelector('img').src = s.imageDataUrl;
    } else {
      if (existingImg) existingImg.remove();
      if (!existingPlaceholder) {
        const ph = document.createElement('div');
        ph.className = 'drop-zone-icon';
        ph.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
        const t1 = document.createElement('div');
        t1.className = 'drop-zone-text';
        t1.textContent = 'Click to browse or drag & drop';
        const t2 = document.createElement('div');
        t2.className = 'drop-zone-sub';
        t2.textContent = 'PNG, JPG, GIF, WEBP';
        if (fileInput) { dz.insertBefore(ph, fileInput); dz.insertBefore(t1, fileInput); dz.insertBefore(t2, fileInput); }
        else { dz.appendChild(ph); dz.appendChild(t1); dz.appendChild(t2); }
      }
    }
  }

  // Called on label input — updates data, filename display, preview and chips
  // without rebuilding the screenshot DOM (preserves focus)
  function labelChanged(i, value) {
    screenshots[i].label = value;
    const entries = document.querySelectorAll('.screenshot-entry');
    if (entries[i]) {
      entries[i].querySelector('.screenshot-filename').textContent = getScreenshotFilename(i);
    }
    document.getElementById('ticketSlug').textContent = getPrefix() + '.md';
    updatePreview();
    updateChips();
  }

  function dzOver(e, i) {
    e.preventDefault();
    activeSlot = i;
    document.getElementById('dz-' + i).classList.add('drag-over');
  }

  function dzLeave(i) {
    document.getElementById('dz-' + i).classList.remove('drag-over');
  }

  function dzDrop(e, i) {
    e.preventDefault();
    dzLeave(i);
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file, i);
  }

  function fileChosen(e, i) {
    const file = e.target.files[0];
    if (file) loadImageFile(file, i);
  }

  function loadImageFile(file, i) {
    const ext = file.name.split('.').pop().toLowerCase() || 'png';
    const reader = new FileReader();
    reader.onload = ev => {
      screenshots[i].imageDataUrl = ev.target.result;
      screenshots[i].imageExt = ext;
      update();
    };
    reader.readAsDataURL(file);
  }

  function addScreenshot() {
    screenshots.push({ label: '', imageDataUrl: null, imageExt: 'png' });
    activeSlot = screenshots.length - 1;
    update();
    setTimeout(() => {
      const entries = document.querySelectorAll('.screenshot-entry');
      if (entries.length) entries[entries.length - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }

  function removeScreenshot(i) {
    if (screenshots.length === 1) {
      screenshots[0] = { label: '', imageDataUrl: null, imageExt: 'png' };
    } else {
      screenshots.splice(i, 1);
    }
    activeSlot = Math.min(activeSlot, screenshots.length - 1);
    update();
  }

  function buildMarkdown() {
    const prefix = getPrefix();
    const num = pad(parseInt(document.getElementById('defNum').value) || 1);
    const titleRaw = (document.getElementById('defTitle').value || 'defect').replace(/-/g, ' ');
    const page = document.getElementById('pageAffected').value.trim() || '[not specified]';
    const desc = document.getElementById('description').value.trim() || '[not specified]';
    const stepsRaw = document.getElementById('steps').value.trim();
    const consoleRaw = document.getElementById('consoleErrors').value.trim();

    const stepsLines = stepsRaw
      ? stepsRaw.split('\n').filter(l => l.trim()).map((l, i) => (i + 1) + '. ' + l.replace(/^\d+\.\s*/, '')).join('\n')
      : '1. [Add steps to reproduce]';

    const screenshotLines = screenshots
      .filter((s, i) => s.imageDataUrl || s.label)
      .map((s, i) => '- ' + getScreenshotFilename(i) + ' — ' + (s.label || 'screenshot ' + (i + 1)));

    return `# Defect Ticket — DEF-${num} ${titleRaw}

## Description

${desc}

## Page / tab affected

${page}

## Screenshots

${screenshotLines.length ? screenshotLines.join('\n') : 'none'}

## Console errors

${consoleRaw || 'none'}

## Steps to reproduce

${stepsLines}
`;
  }

  function updatePreview() {
    const md = buildMarkdown();
    const lines = md.split('\n').map(line => {
      if (line.startsWith('# ')) return `<span class="md-h1">${line}</span>`;
      if (line.startsWith('## ')) return `<span class="md-h2">${line}</span>`;
      return line;
    });
    document.getElementById('preview').innerHTML = lines.join('\n');
  }

  function updateChips() {
    const chips = document.getElementById('filenameChips');
    const items = screenshots.map((s, i) => {
      const fname = getScreenshotFilename(i);
      const hasImg = !!s.imageDataUrl;
      return `<div class="filename-chip">
        <div class="chip-dot" style="background:${hasImg ? 'var(--brand)' : 'var(--zinc-300)'}"></div>
        <span>${fname}</span>
        ${hasImg ? '<span style="font-size:10px;color:var(--brand);font-family:inherit;margin-left:auto">image attached</span>' : '<span style="font-size:10px;color:var(--zinc-400);font-family:inherit;margin-left:auto">no image</span>'}
      </div>`;
    });
    chips.innerHTML = items.join('');
  }

  function update() {
    const prefix = getPrefix();
    document.getElementById('ticketSlug').textContent = prefix + '.md';
    renderScreenshots();
    updatePreview();
    updateChips();
  }

  async function downloadAll() {
    const prefix = getPrefix();
    const md = buildMarkdown();

    // Download the markdown file
    const blob = new Blob([md], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = prefix + '.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);

    // Download each image with correct filename
    for (let i = 0; i < screenshots.length; i++) {
      const s = screenshots[i];
      if (!s.imageDataUrl) continue;
      await new Promise(resolve => setTimeout(resolve, 200));
      const imgA = document.createElement('a');
      imgA.href = s.imageDataUrl;
      imgA.download = getScreenshotFilename(i);
      document.body.appendChild(imgA);
      imgA.click();
      document.body.removeChild(imgA);
    }

    showToast('Downloaded ' + prefix + '.md' + (screenshots.some(s => s.imageDataUrl) ? ' + images' : ''));
  }

  function copyTicket() {
    const md = buildMarkdown();
    navigator.clipboard.writeText(md).then(() => showToast('Copied to clipboard'));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Global paste handler — pastes image into the active screenshot slot
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        const ext = item.type.split('/')[1] || 'png';
        const reader = new FileReader();
        reader.onload = ev => {
          // If active slot has an image, add a new slot
          if (screenshots[activeSlot].imageDataUrl) {
            screenshots.push({ label: '', imageDataUrl: ev.target.result, imageExt: ext });
            activeSlot = screenshots.length - 1;
          } else {
            screenshots[activeSlot].imageDataUrl = ev.target.result;
            screenshots[activeSlot].imageExt = ext;
          }
          update();
          showToast('Screenshot pasted into slot ' + (activeSlot + 1));
        };
        reader.readAsDataURL(file);
        break;
      }
    }
  });

  // ── AI quality check ─────────────────────────────────────────────────────

  async function runAiCheck() {
    const key = localStorage.getItem('zyantik_api_key') || '';
    if (!key) { showToast('Add your API key in AI Settings first'); return; }

    const btn = document.getElementById('aiCheckBtn');
    btn.innerHTML = '<div class="spinner"></div> Checking…';
    btn.disabled = true;

    const md = buildMarkdown();
    const hasScreenshots = screenshots.some(s => s.imageDataUrl);

    const prompt = `You are a quality reviewer for software defect tickets that will be processed by an AI agent pipeline. Review this defect ticket and evaluate its quality.

DEFECT TICKET:
${md}

SCREENSHOTS ATTACHED: ${hasScreenshots ? 'Yes (' + screenshots.filter(s => s.imageDataUrl).length + ' image(s))' : 'No'}

Evaluate the ticket on these criteria:
1. Description clarity — is the defect specific and unambiguous?
2. Page/tab specified — does the agent know exactly where to look?
3. Steps to reproduce — are they present, sequential and complete?
4. Expected vs actual behaviour — is it clear what should happen vs what does?
5. Screenshot quality — are images attached and labels meaningful?
6. Agent actionability — can an AI agent act on this without asking follow-up questions?

Respond ONLY with a JSON object in this exact format, no markdown, no preamble:
{
  "score": <integer 0-100>,
  "issues": [
    {"type": "issue", "text": "<specific problem that will prevent the agent from working>"},
    {"type": "suggestion", "text": "<improvement that would help but is not blocking>"},
    {"type": "ok", "text": "<something that is well-specified>"}
  ],
  "summary": "<1-2 sentence overall assessment and key recommendation>"
}

Use "issue" for blocking problems, "suggestion" for improvements, "ok" for things done well. Include 2-5 items total.`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: localStorage.getItem('zyantik_model') || 'claude-sonnet-4-5',
          max_tokens: 800,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'API error ' + res.status);
      }

      const data = await res.json();
      const text = data.content?.[0]?.text || '';
      const clean = text.replace(/```json|```/g, '').trim();
      const result = JSON.parse(clean);
      renderAiResult(result);

    } catch (e) {
      showToast('AI check failed: ' + e.message);
      btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm-.75 2.5v3.25l2.5 1.5.5-.87-2-1.2V5.5h-1z"/></svg> Run AI check';
      btn.disabled = false;
    }
  }

  function renderAiResult(result) {
    const panel = document.getElementById('aiResult');
    const header = document.getElementById('aiResultHeader');
    const icon = document.getElementById('aiResultIcon');
    const title = document.getElementById('aiResultTitle');
    const scoreEl = document.getElementById('aiScore');
    const issuesEl = document.getElementById('aiIssues');
    const summaryEl = document.getElementById('aiSummary');
    const warnBadge = document.getElementById('warnBadge');
    const btn = document.getElementById('aiCheckBtn');

    const score = Math.max(0, Math.min(100, result.score));
    const issues = (result.issues || []).filter(i => i.type === 'issue');
    const issueCount = issues.length;

    // Score colour
    scoreEl.textContent = score + '/100';
    scoreEl.className = 'ai-score-value ' + (score >= 75 ? 'high' : score >= 50 ? 'mid' : 'low');

    // Header state
    header.className = 'ai-result-header ' + (issueCount === 0 ? 'pass' : score >= 50 ? 'warn' : 'err');
    if (issueCount === 0) {
      icon.innerHTML = '<path d="M13.854 3.646a.5.5 0 010 .708l-7 7a.5.5 0 01-.708 0l-3.5-3.5a.5.5 0 11.708-.708L6.5 10.293l6.646-6.647a.5.5 0 01.708 0z"/>';
      title.textContent = 'Ticket looks good — ready to download';
    } else {
      icon.innerHTML = '<path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a.5.5 0 01.5.5v4a.5.5 0 01-1 0v-4A.5.5 0 018 4zm0 7a.75.75 0 110 1.5A.75.75 0 018 11z"/>';
      title.textContent = issueCount + ' issue' + (issueCount > 1 ? 's' : '') + ' found — review before downloading';
    }

    // Issues list
    const typeIcon = { issue: '⚠', suggestion: '→', ok: '✓' };
    issuesEl.innerHTML = (result.issues || []).map(item =>
      `<div class="ai-issue ${item.type}"><span class="ai-issue-icon">${typeIcon[item.type] || '·'}</span><span>${item.text}</span></div>`
    ).join('');

    summaryEl.textContent = result.summary || '';
    panel.classList.add('visible');

    // Warn badge on download button
    if (issueCount > 0) {
      warnBadge.textContent = issueCount;
      warnBadge.classList.add('visible');
    } else {
      warnBadge.classList.remove('visible');
    }

    // Reset AI check button
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor" width="14" height="14"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm-.75 2.5v3.25l2.5 1.5.5-.87-2-1.2V5.5h-1z"/></svg> Re-check';
    btn.disabled = false;
  }

  update();
  loadSettings();
</body>
</html>
