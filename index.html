<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defect Ticket Generator — Zyantik</title>
<style>
  :root {
    --brand:        #0d9488;
    --brand-dark:   #0f766e;
    --brand-light:  #f0fdfa;
    --zinc-50:      #fafafa;
    --zinc-100:     #f4f4f5;
    --zinc-200:     #e4e4e7;
    --zinc-300:     #d4d4d8;
    --zinc-400:     #a1a1aa;
    --zinc-500:     #71717a;
    --zinc-600:     #52525b;
    --zinc-900:     #18181b;
    --radius-sm:    4px;
    --radius-md:    6px;
    --radius-lg:    8px;
    --radius-xl:    12px;
    --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg:    0 8px 24px rgba(0,0,0,0.12);
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--zinc-50);
    color: var(--zinc-900);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
 
  /* Header */
  .app-header {
    background: white;
    border-bottom: 1px solid var(--zinc-200);
    padding: 0 32px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
 
  .logo {
    width: 30px; height: 30px;
    background: var(--brand);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .logo svg { width: 16px; height: 16px; fill: white; }
 
  .app-title { font-size: 14px; font-weight: 600; color: var(--zinc-900); }
  .app-divider { width: 1px; height: 18px; background: var(--zinc-200); }
  .app-subtitle { font-size: 12px; color: var(--zinc-500); }
 
  /* Layout */
  .page { display: grid; grid-template-columns: 1fr 420px; gap: 24px; padding: 24px 32px; max-width: 1280px; margin: 0 auto; }
 
  /* Cards */
  .card {
    background: white;
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }
 
  .card-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--zinc-100);
    display: flex;
    align-items: center;
    gap: 8px;
  }
 
  .card-header-icon {
    width: 20px; height: 20px;
    background: var(--brand-light);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .card-header-icon svg { width: 12px; height: 12px; fill: var(--brand); }
 
  .card-title { font-size: 12px; font-weight: 600; color: var(--zinc-900); }
 
  .card-body { padding: 16px 20px; }
 
  /* Form elements */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
 
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--zinc-500);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
 
  input[type="text"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    color: var(--zinc-900);
    background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none;
  }
 
  input[type="text"]:focus,
  input[type="number"]:focus,
  textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
  }
 
  textarea { resize: vertical; line-height: 1.6; }
 
  .two-col { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
 
  /* Ticket slug display */
  .ticket-slug {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 12px;
    background: var(--zinc-50);
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    color: var(--brand);
    font-weight: 600;
    letter-spacing: -0.2px;
  }
 
  /* Screenshot rows */
  .screenshots-wrap { display: flex; flex-direction: column; gap: 10px; }
 
  .screenshot-entry {
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color 0.15s;
  }
 
  .screenshot-entry:focus-within { border-color: var(--brand); }
 
  .screenshot-entry-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--zinc-50);
    border-bottom: 1px solid var(--zinc-100);
  }
 
  .screenshot-num {
    width: 20px; height: 20px;
    background: var(--brand);
    color: white;
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
 
  .screenshot-filename {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    color: var(--zinc-500);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
 
  .remove-btn {
    width: 24px; height: 24px;
    border: none;
    background: none;
    color: var(--zinc-400);
    cursor: pointer;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
 
  .remove-btn:hover { background: #fee2e2; color: #dc2626; }
 
  .screenshot-entry-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
 
  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--zinc-200);
    border-radius: var(--radius-md);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    background: white;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }
 
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--brand);
    background: var(--brand-light);
  }
 
  .drop-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
 
  .drop-zone-icon { color: var(--zinc-400); }
  .drop-zone-icon svg { width: 24px; height: 24px; }
 
  .drop-zone-text {
    font-size: 12px;
    color: var(--zinc-500);
    pointer-events: none;
  }
 
  .drop-zone-sub {
    font-size: 11px;
    color: var(--zinc-400);
    pointer-events: none;
  }
 
  .drop-zone-preview {
    width: 100%;
    border-radius: var(--radius-sm);
    max-height: 140px;
    object-fit: contain;
    display: none;
  }
 
  /* Add screenshot button */
  .add-screenshot-btn {
    width: 100%;
    padding: 9px;
    border: 1px dashed var(--zinc-300);
    border-radius: var(--radius-md);
    background: white;
    color: var(--zinc-500);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }
 
  .add-screenshot-btn:hover {
    border-color: var(--brand);
    color: var(--brand);
    background: var(--brand-light);
  }
 
  /* Paste hint */
  .paste-hint {
    background: var(--brand-light);
    border: 1px solid #99f6e4;
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: 11px;
    color: var(--brand-dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }
 
  .paste-hint kbd {
    background: white;
    border: 1px solid #99f6e4;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: inherit;
    font-weight: 600;
  }
 
  /* Right panel — preview */
  .preview-panel { position: sticky; top: 76px; height: fit-content; }
 
  .preview-box {
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--zinc-600);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 440px;
    overflow-y: auto;
    padding: 16px 20px;
  }
 
  .preview-box .md-h1 { color: var(--zinc-900); font-weight: 700; font-size: 12px; }
  .preview-box .md-h2 { color: var(--brand); font-weight: 600; }
  .preview-box .md-key { color: var(--zinc-900); }
 
  /* Filename chips */
  .filename-chips { display: flex; flex-direction: column; gap: 6px; padding: 12px 20px; border-top: 1px solid var(--zinc-100); }
 
  .filename-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--zinc-50);
    border: 1px solid var(--zinc-200);
    border-radius: var(--radius-md);
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11px;
    color: var(--zinc-600);
  }
 
  .chip-dot {
    width: 8px; height: 8px;
    background: var(--brand);
    border-radius: 50%;
    flex-shrink: 0;
  }
 
  /* Action buttons */
  .actions {
    padding: 14px 20px;
    border-top: 1px solid var(--zinc-100);
    display: flex;
    gap: 8px;
  }
 
  .btn {
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--zinc-200);
    background: white;
    color: var(--zinc-600);
  }
 
  .btn:hover { background: var(--zinc-50); border-color: var(--zinc-300); }
  .btn:active { transform: scale(0.98); }
 
  .btn-primary {
    background: var(--brand);
    color: white;
    border-color: var(--brand);
    flex: 1;
    justify-content: center;
  }
 
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
 
  .btn svg { width: 14px; height: 14px; }
 
  /* Status toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--zinc-900);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius-lg);
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s ease;
    pointer-events: none;
    z-index: 999;
  }
 
  .toast.show { opacity: 1; transform: translateY(0); }
 
  /* Section label */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--zinc-400);
    margin-bottom: 10px;
  }
</style>
</head>
<body>
 
<header class="app-header">
  <div class="logo">
    <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
  </div>
  <span class="app-title">Zyantik</span>
  <div class="app-divider"></div>
  <span class="app-subtitle">Defect Ticket Generator</span>
</header>
 
<div class="page">
 
  <!-- Left: form -->
  <div class="form-col">
 
    <!-- Identity card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm1 4H7V5h2v2zm0 5H7V8h2v3z"/></svg>
        </div>
        <span class="card-title">Ticket identity</span>
      </div>
      <div class="card-body">
        <div class="two-col field">
          <div>
            <label>Number</label>
            <input type="number" id="defNum" min="1" max="999" value="1" oninput="update()">
          </div>
          <div>
            <label>Short title (use hyphens)</label>
            <input type="text" id="defTitle" placeholder="e.g. header-overlap" oninput="update()">
          </div>
        </div>
        <div class="field">
          <label>Generated filename</label>
          <div class="ticket-slug" id="ticketSlug">DEF-001-defect.md</div>
        </div>
      </div>
    </div>
 
    <!-- Details card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M2 3h12v2H2V3zm0 4h12v2H2V7zm0 4h7v2H2v-2z"/></svg>
        </div>
        <span class="card-title">Defect details</span>
      </div>
      <div class="card-body">
        <div class="field">
          <label>Page / tab affected</label>
          <input type="text" id="pageAffected" placeholder="e.g. Summary tab, Add modal on Vendor Costs" oninput="update()">
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="What is wrong, where you see it, and what you expected instead" oninput="update()"></textarea>
        </div>
        <div class="field">
          <label>Steps to reproduce</label>
          <textarea id="steps" rows="3" placeholder="1. Open the app&#10;2. Navigate to...&#10;3. You see X instead of Y" oninput="update()"></textarea>
        </div>
        <div class="field">
          <label>Console errors</label>
          <textarea id="consoleErrors" rows="2" placeholder="Paste browser console errors here, or leave blank" oninput="update()"></textarea>
        </div>
      </div>
    </div>
 
    <!-- Screenshots card -->
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M1 3a1 1 0 011-1h12a1 1 0 011 1v9a1 1 0 01-1 1H2a1 1 0 01-1-1V3zm1 1v7h12V4H2zm5 1l3 3H9v2H7V8H5l3-3z"/></svg>
        </div>
        <span class="card-title">Screenshots</span>
      </div>
      <div class="card-body">
        <div class="paste-hint">
          <kbd>Ctrl</kbd> + <kbd>V</kbd> anywhere on the page to paste a screenshot directly into the active slot
        </div>
        <div class="screenshots-wrap" id="screenshotList" style="margin-top:12px"></div>
        <button class="add-screenshot-btn" onclick="addScreenshot()" style="margin-top:10px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a1 1 0 011 1v4h4a1 1 0 010 2H9v4a1 1 0 01-2 0V9H3a1 1 0 010-2h4V3a1 1 0 011-1z"/></svg>
          Add screenshot
        </button>
      </div>
    </div>
 
  </div>
 
  <!-- Right: preview -->
  <div class="preview-panel">
    <div class="card">
      <div class="card-header">
        <div class="card-header-icon">
          <svg viewBox="0 0 16 16"><path d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1zm1 2v8h8V4H4z"/></svg>
        </div>
        <span class="card-title">Ticket preview</span>
      </div>
      <div class="preview-box" id="preview"></div>
      <div class="filename-chips" id="filenameChips"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="downloadAll()">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a1 1 0 011 1v6.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 011.414-1.414L7 8.586V2a1 1 0 011-1zM3 13a1 1 0 000 2h10a1 1 0 000-2H3z"/></svg>
          Download ticket + images
        </button>
        <button class="btn" onclick="copyTicket()" title="Copy markdown">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2a2 2 0 00-2 2v8a2 2 0 002 2h5a2 2 0 002-2V8l-4-4H4zm5 0l4 4h-3a1 1 0 01-1-1V2zM6 6a1 1 0 000 2h4a1 1 0 000-2H6zm0 3a1 1 0 000 2h3a1 1 0 000-2H6z"/></svg>
        </button>
      </div>
    </div>
  </div>
 
</div>
 
<div class="toast" id="toast"></div>
 
<script>
  let screenshots = [{ label: '', imageDataUrl: null, imageExt: 'png' }];
  let activeSlot = 0;
 
  function pad(n) { return String(n).padStart(3, '0'); }
 
  function slug(str) {
    return str.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'defect';
  }
 
  function getPrefix() {
    const num = pad(parseInt(document.getElementById('defNum').value) || 1);
    const title = slug(document.getElementById('defTitle').value || 'defect');
    return 'DEF-' + num + '-' + title;
  }
 
  function getScreenshotFilename(i) {
    const prefix = getPrefix();
    const s = screenshots[i];
    const lbl = s.label ? slug(s.label) : 'screenshot-' + (i + 1);
    return prefix + '-' + lbl + '.' + (s.imageExt || 'png');
  }
 
  function renderScreenshots() {
    const list = document.getElementById('screenshotList');
    list.innerHTML = '';
    screenshots.forEach((s, i) => {
      const fname = getScreenshotFilename(i);
      const entry = document.createElement('div');
      entry.className = 'screenshot-entry';
      entry.innerHTML = `
        <div class="screenshot-entry-header">
          <div class="screenshot-num">${i + 1}</div>
          <span class="screenshot-filename">${fname}</span>
          <button class="remove-btn" onclick="removeScreenshot(${i})" title="Remove">×</button>
        </div>
        <div class="screenshot-entry-body">
          <div>
            <label>Label / description</label>
            <input type="text" placeholder="e.g. header overlap visible" value="${s.label}"
              oninput="screenshots[${i}].label=this.value;update()" onfocus="activeSlot=${i}">
          </div>
          <div class="drop-zone" id="dz-${i}"
            ondragover="dzOver(event,${i})" ondragleave="dzLeave(${i})"
            ondrop="dzDrop(event,${i})" onclick="document.getElementById('fi-${i}').click()"
            onfocus="activeSlot=${i}" tabindex="0">
            <input type="file" id="fi-${i}" accept="image/*"
              onchange="fileChosen(event,${i})" onclick="event.stopPropagation()" style="display:none">
            ${s.imageDataUrl
              ? `<img src="${s.imageDataUrl}" class="drop-zone-preview" style="display:block;max-height:140px;width:100%;object-fit:contain;border-radius:4px">`
              : `<div class="drop-zone-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>
                 <div class="drop-zone-text">Click to browse or drag & drop</div>
                 <div class="drop-zone-sub">PNG, JPG, GIF, WEBP</div>`
            }
          </div>
        </div>
      `;
      list.appendChild(entry);
    });
  }
 
  function dzOver(e, i) {
    e.preventDefault();
    activeSlot = i;
    document.getElementById('dz-' + i).classList.add('drag-over');
  }
 
  function dzLeave(i) {
    document.getElementById('dz-' + i).classList.remove('drag-over');
  }
 
  function dzDrop(e, i) {
    e.preventDefault();
    dzLeave(i);
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadImageFile(file, i);
  }
 
  function fileChosen(e, i) {
    const file = e.target.files[0];
    if (file) loadImageFile(file, i);
  }
 
  function loadImageFile(file, i) {
    const ext = file.name.split('.').pop().toLowerCase() || 'png';
    const reader = new FileReader();
    reader.onload = ev => {
      screenshots[i].imageDataUrl = ev.target.result;
      screenshots[i].imageExt = ext;
      update();
    };
    reader.readAsDataURL(file);
  }
 
  function addScreenshot() {
    screenshots.push({ label: '', imageDataUrl: null, imageExt: 'png' });
    activeSlot = screenshots.length - 1;
    update();
    setTimeout(() => {
      const entries = document.querySelectorAll('.screenshot-entry');
      if (entries.length) entries[entries.length - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
 
  function removeScreenshot(i) {
    if (screenshots.length === 1) {
      screenshots[0] = { label: '', imageDataUrl: null, imageExt: 'png' };
    } else {
      screenshots.splice(i, 1);
    }
    activeSlot = Math.min(activeSlot, screenshots.length - 1);
    update();
  }
 
  function buildMarkdown() {
    const prefix = getPrefix();
    const num = pad(parseInt(document.getElementById('defNum').value) || 1);
    const titleRaw = (document.getElementById('defTitle').value || 'defect').replace(/-/g, ' ');
    const page = document.getElementById('pageAffected').value.trim() || '[not specified]';
    const desc = document.getElementById('description').value.trim() || '[not specified]';
    const stepsRaw = document.getElementById('steps').value.trim();
    const consoleRaw = document.getElementById('consoleErrors').value.trim();
 
    const stepsLines = stepsRaw
      ? stepsRaw.split('\n').filter(l => l.trim()).map((l, i) => (i + 1) + '. ' + l.replace(/^\d+\.\s*/, '')).join('\n')
      : '1. [Add steps to reproduce]';
 
    const screenshotLines = screenshots
      .filter((s, i) => s.imageDataUrl || s.label)
      .map((s, i) => '- ' + getScreenshotFilename(i) + ' — ' + (s.label || 'screenshot ' + (i + 1)));
 
    return `# Defect Ticket — DEF-${num} ${titleRaw}
 
## Description
 
${desc}
 
## Page / tab affected
 
${page}
 
## Screenshots
 
${screenshotLines.length ? screenshotLines.join('\n') : 'none'}
 
## Console errors
 
${consoleRaw || 'none'}
 
## Steps to reproduce
 
${stepsLines}
`;
  }
 
  function updatePreview() {
    const md = buildMarkdown();
    const lines = md.split('\n').map(line => {
      if (line.startsWith('# ')) return `<span class="md-h1">${line}</span>`;
      if (line.startsWith('## ')) return `<span class="md-h2">${line}</span>`;
      return line;
    });
    document.getElementById('preview').innerHTML = lines.join('\n');
  }
 
  function updateChips() {
    const chips = document.getElementById('filenameChips');
    const items = screenshots.map((s, i) => {
      const fname = getScreenshotFilename(i);
      const hasImg = !!s.imageDataUrl;
      return `<div class="filename-chip">
        <div class="chip-dot" style="background:${hasImg ? 'var(--brand)' : 'var(--zinc-300)'}"></div>
        <span>${fname}</span>
        ${hasImg ? '<span style="font-size:10px;color:var(--brand);font-family:inherit;margin-left:auto">image attached</span>' : '<span style="font-size:10px;color:var(--zinc-400);font-family:inherit;margin-left:auto">no image</span>'}
      </div>`;
    });
    chips.innerHTML = items.join('');
  }
 
  function update() {
    const prefix = getPrefix();
    document.getElementById('ticketSlug').textContent = prefix + '.md';
    renderScreenshots();
    updatePreview();
    updateChips();
  }
 
  async function downloadAll() {
    const prefix = getPrefix();
    const md = buildMarkdown();
 
    // Download the markdown file
    const blob = new Blob([md], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = prefix + '.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
 
    // Download each image with correct filename
    for (let i = 0; i < screenshots.length; i++) {
      const s = screenshots[i];
      if (!s.imageDataUrl) continue;
      await new Promise(resolve => setTimeout(resolve, 200));
      const imgA = document.createElement('a');
      imgA.href = s.imageDataUrl;
      imgA.download = getScreenshotFilename(i);
      document.body.appendChild(imgA);
      imgA.click();
      document.body.removeChild(imgA);
    }
 
    showToast('Downloaded ' + prefix + '.md' + (screenshots.some(s => s.imageDataUrl) ? ' + images' : ''));
  }
 
  function copyTicket() {
    const md = buildMarkdown();
    navigator.clipboard.writeText(md).then(() => showToast('Copied to clipboard'));
  }
 
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
 
  // Global paste handler — pastes image into the active screenshot slot
  document.addEventListener('paste', e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        const ext = item.type.split('/')[1] || 'png';
        const reader = new FileReader();
        reader.onload = ev => {
          // If active slot has an image, add a new slot
          if (screenshots[activeSlot].imageDataUrl) {
            screenshots.push({ label: '', imageDataUrl: ev.target.result, imageExt: ext });
            activeSlot = screenshots.length - 1;
          } else {
            screenshots[activeSlot].imageDataUrl = ev.target.result;
            screenshots[activeSlot].imageExt = ext;
          }
          update();
          showToast('Screenshot pasted into slot ' + (activeSlot + 1));
        };
        reader.readAsDataURL(file);
        break;
      }
    }
  });
 
  update();
</script>
</body>
</html>
